<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChronoGames · Calendrier des sorties jeux vidéo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#12151C">
<meta name="apple-mobile-web-app-title" content="ChronoGames">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-row">
    <div class="brand">
      <h1>ChronoGames</h1>
      <p>Les sorties jeux vidéo, mois par mois. Mets une étoile sur ceux que tu attends pour les retrouver dans ta liste.</p>
    </div>
    <form class="search" id="search-form" role="search">
      <input type="search" id="search-input" placeholder="Chercher un jeu (Hollow Knight, GTA VI…)" aria-label="Chercher un jeu">
      <button class="btn" type="submit">Chercher</button>
    </form>
  </div>
</header>

<main class="wrap">
  <nav class="tabs" role="tablist" aria-label="Vues">
    <button class="tab" role="tab" data-mode="upcoming" aria-selected="true">À venir</button>
    <button class="tab" role="tab" data-mode="anticipated" aria-selected="false">Les plus attendus</button>
    <button class="tab" role="tab" data-mode="moment" aria-selected="false">Populaires du moment</button>
    <button class="tab" role="tab" data-mode="year" aria-selected="false" id="year-tab">Top de l'année</button>
    <button class="tab" role="tab" data-mode="period" aria-selected="false">Par période</button>
    <button class="tab" role="tab" data-mode="wishlist" aria-selected="false">Ma liste<span class="count" id="wish-count">0</span></button>
    <button class="tab" role="tab" data-mode="search" aria-selected="false" hidden id="search-tab">Recherche</button>
  </nav>

  <section class="filters" id="filters" aria-label="Filtres">
    <div class="filter-line" id="period-line" hidden>
      <label class="field">Année
        <select id="year-select"></select>
      </label>
      <div class="chips" id="quarter-chips" aria-label="Trimestre">
        <button class="chip" data-quarter="all" aria-pressed="true">Toute l'année</button>
        <button class="chip" data-quarter="1" aria-pressed="false">Janv – mars</button>
        <button class="chip" data-quarter="2" aria-pressed="false">Avril – juin</button>
        <button class="chip" data-quarter="3" aria-pressed="false">Juil – sept</button>
        <button class="chip" data-quarter="4" aria-pressed="false">Oct – déc</button>
      </div>
    </div>

    <div class="filter-line">
      <div class="chips" id="platform-chips" aria-label="Plateforme">
        <button class="chip" data-platform="" aria-pressed="true">Toutes</button>
        <button class="chip" data-platform="6" aria-pressed="false">PC</button>
        <button class="chip" data-platform="167" aria-pressed="false">PS5</button>
        <button class="chip" data-platform="169" aria-pressed="false">Xbox Series</button>
        <button class="chip" data-platform="130" aria-pressed="false">Switch</button>
      </div>
    </div>

    <div class="selects">
      <label class="field">Genre
        <select id="genre-select">
          <option value="">Tous les genres</option>
          <option value="31">Aventure</option>
          <option value="12">RPG</option>
          <option value="5">Shooter</option>
          <option value="4">Combat</option>
          <option value="25">Hack and slash / Beat 'em up</option>
          <option value="8">Plateforme</option>
          <option value="10">Course</option>
          <option value="14">Sport</option>
          <option value="15">Stratégie</option>
          <option value="11">Stratégie temps réel</option>
          <option value="16">Stratégie au tour par tour</option>
          <option value="24">Tactique</option>
          <option value="13">Simulation / Gestion</option>
          <option value="9">Réflexion</option>
          <option value="2">Point-and-click</option>
          <option value="34">Visual novel</option>
          <option value="32">Indé</option>
          <option value="33">Arcade</option>
          <option value="35">Cartes et plateau</option>
          <option value="36">MOBA</option>
          <option value="7">Musique</option>
        </select>
      </label>
      <label class="field">Univers
        <select id="theme-select">
          <option value="">Tous les univers</option>
          <option value="38">Monde ouvert</option>
          <option value="17">Fantasy</option>
          <option value="18">Science-fiction</option>
          <option value="19">Horreur</option>
          <option value="21">Survie</option>
          <option value="33">Sandbox</option>
          <option value="20">Thriller</option>
          <option value="43">Mystère</option>
          <option value="22">Historique</option>
          <option value="39">Guerre</option>
          <option value="31">Drame</option>
        </select>
      </label>
      <label class="field" id="sort-field">Trier par
        <select id="sort-select">
          <option value="popular">Les plus suivis</option>
          <option value="date_asc">Date de sortie</option>
          <option value="date_desc">Date (plus récent d'abord)</option>
          <option value="rating">Mieux notés</option>
        </select>
      </label>
      <label class="toggle"><input type="checkbox" id="hide-nocover" checked> Masquer les jeux sans jaquette</label>
    </div>
  </section>

  <p class="status" id="status" aria-live="polite"></p>
  <div id="results"></div>
  <div class="more"><button class="btn ghost" id="more-btn" hidden>Afficher plus de jeux</button></div>
</main>

<footer>
  <div class="wrap">Données fournies par <a href="https://www.igdb.com" target="_blank" rel="noopener">IGDB</a>.</div>
</footer>

<dialog id="detail" aria-labelledby="d-title"></dialog>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
